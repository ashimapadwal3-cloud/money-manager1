<style>

</style></head><body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const mem={},ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT={exp:{Food:'🍔',Transport:'🚌',Shopping:'🛍️',Bills:'💡',Health:'💊',Fun:'🎬',Education:'📚',Other:'🧾'},inc:{Salary:'💼',Freelance:'💻',Gift:'🎁',Other:'💰'},trf:{Transfer:'🔁'}};
const mk=n=>ui.hide?'••••••':fmt(n);
const AL={cash:'💵 Cash',online:'🏦 Online',cheque:'🧾 Cheque'};
const HUES=[335,45,262,217,160,12];
let S=null,ui={theme:'auto',hue:335};
try{Object.assign(ui,JSON.parse(ls.get('mm:ui')||'{}'))}catch(e){}
function applyUI(){const r=document.documentElement;r.style.setProperty('--h',ui.hue);ui.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',ui.theme);ls.set('mm:ui',JSON.stringify(ui))}
applyUI();
/* ---------- security: PBKDF2 login check + AES-GCM encrypted data ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt,it=150000){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,512));return{k:await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['encrypt','decrypt']),v:b64(bits.slice(32)),r:b64(bits.slice(0,32))}}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},S.k,enc.encode(JSON.stringify(S.d)));const kk='mm:d:'+S.uid,old=ls.get(kk);if(old)ls.set(kk+':prev',old);if(!ls.set(kk,b64(iv)+'.'+b64(ct)))throw 0}
async function unseal(uid,k){const raw=ls.get('mm:d:'+uid);if(!raw)return{tx:[],budget:0,cur:'₹'};const dc=async s=>{const[i,c]=s.split('.');const d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},k,ub(c))));if(!Array.isArray(d.tx))throw 0;return d};try{return await dc(raw)}catch(e){const p=ls.get('mm:d:'+uid+':prev');if(!p)throw e;const d=await dc(p);setTimeout(()=>toast('Recovered your data from the automatic backup.'),400);return d}}
let fails=0,lock=0;
const users=()=>{try{return JSON.parse(ls.get('mm:u')||'{}')}catch(e){return{}}};
/* ---------- helpers ---------- */
const td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=n=>S.d.cur+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,t)=>a.filter(x=>x.type==t&&x.cs!='pending').reduce((s,x)=>s+x.amt,0);
const balOf=(T,acc='all')=>{const o=S.d.open||{};let s=acc=='all'?(o.cash||0)+(o.online||0):(o[acc]||0);T.forEach(t=>{if(t.cs=='pending')return;const a=t.acc||'online';if(t.type=='trf'){if(acc=='cash'||acc=='online')s+=a==acc?-t.amt:t.amt;return}if(acc!='all'&&a!=acc)return;s+=t.type=='inc'?t.amt:-t.amt});return s};
const dl=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
let q=Promise.resolve();const save=()=>{q=q.then(seal).catch(()=>toast('⚠ Couldn’t save. Browser storage may be full or blocked.'))};
/* ---------- auth ---------- */
function authView(mode='in'){
$('#app').innerHTML=`<main class="auth"><div class="card authc"><div class="logo">💰</div><h1>Money Manager</h1><p class="mut">Track income and expenses, privately on your device.</p>
<div class="seg"><button data-m="in" class="${mode=='in'?'on':''}">Log in</button><button data-m="up" class="${mode=='up'?'on':''}">Sign up</button></div>
<label>User ID<input id="u" autocomplete="username" autocapitalize="off" placeholder="e.g. user_01"></label>
<label>Password<input id="p" type="password" autocomplete="${mode=='in'?'current-password':'new-password'}" placeholder="${mode=='in'?'Your password':'At least 8 characters'}"></label>
${mode=='up'?'<label>Confirm password<input id="p2" type="password" autocomplete="new-password"></label>':''}
<p class="err" id="er"></p><button class="btn" id="go" style="width:100%">${mode=='in'?'Log in':'Create account'}</button>
<button class="btn ghost" data-a="rs" style="width:100%;margin-top:10px">Restore from backup</button><p class="mut" style="font-size:12px;margin:14px 0 0">Your records are encrypted with your password and stored only in this browser. If you forget the password, the data can’t be recovered.</p></div></main>`;
$$('.seg button').forEach(b=>b.onclick=()=>authView(b.dataset.m));
$('#go').onclick=()=>doAuth(mode);
$$('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')doAuth(mode)});
}
async function doAuth(mode){
const uid=$('#u').value.trim().toLowerCase(),pw=$('#p').value,U=users(),er=$('#er'),go=$('#go');
const fail=m=>{er.textContent=m;go.disabled=false};
if(!/^[a-z0-9_.-]{3,20}$/.test(uid))return fail('ID must be 3–20 letters, numbers or _ . -');
if(pw.length<(mode=='up'?8:6))return fail(mode=='up'?'Choose a password with at least 8 characters.':'Password needs at least 6 characters.');
if(Date.now()<lock)return fail('Too many attempts. Try again in '+Math.ceil((lock-Date.now())/1000)+'s.');
go.disabled=true;er.textContent='';
try{
if(mode=='up'){
if(U[uid])return fail('That ID is already taken.');
if(pw!==$('#p2').value)return fail('Passwords don’t match.');
const salt=crypto.getRandomValues(new Uint8Array(16)),{k,v,r}=await derive(pw,salt,600000);
U[uid]={s:b64(salt),v,i:600000};ls.set('mm:u',JSON.stringify(U));
S={uid,k,r,d:{tx:[],budget:0,cur:'₹'}};await seal();
}else{
const u=U[uid];if(!u)return fail('Wrong ID or password.');
const{k,v,r}=await derive(pw,ub(u.s),u.i||150000);if(v!==u.v){if(++fails>=5){lock=Date.now()+30000;fails=0}return fail('Wrong ID or password.')}
S={uid,k,r,d:await unseal(uid,k)};
}
Object.assign(S,{view:'dash',q:'',f:'all',m:td().slice(0,7)});applyRec();try{sessionStorage.setItem('mm:s',JSON.stringify({uid:S.uid,r:S.r}))}catch(x){}shell();show();
}catch(e){fail('Something went wrong. Please try again.')}
}
/* ---------- shell ---------- */
const NAV=[['dash','🏠','Dashboard'],['daily','📅','Daily'],['plan','🎯','Plan'],['set','⚙️','Settings']];
function shell(){
$('#app').innerHTML=`<header class="bar"><div class="brand">💰 <b>Money Manager</b><span id='net' hidden>Offline</span></div>
<nav class="nav">${NAV.map(n=>`<button data-a="nav" data-v="${n[0]}">${n[1]} ${n[2]}</button>`).join('')}</nav>
<div class="tools"><button class="ic" data-a="look" title="Theme and colour" aria-label="Theme and colour">🎨</button><button class="ic" data-a="out" title="Log out" aria-label="Log out">⎋</button></div></header>
<main id="main"></main><button class="fab" data-a="add" aria-label="Add record">+</button>`}
function show(){
net();$$('.nav button').forEach(b=>{const on=b.dataset.v==S.view;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});

const m=modal(`<h2>${id?'Edit':'Add'} record</h2><div class="seg" id="ty"><button data-t="exp">Expense</button><button data-t="inc">Income</button><button data-t="trf">Transfer</button></div><div class="seg" id="ac"><button data-c="cash"></button><button data-c="online"></button><button data-c="cheque"></button></div><label>Amount (type it or slide)<input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${t.amt}"></label><input id='sl' type='range' min='0' max='${Math.max(10000,Math.ceil((t.amt||0)/1000)*2000)}' step='10' value='${t.amt||0}' aria-label='Amount slider' style='margin:0 0 8px'><div class='row' style='justify-content:flex-start;margin:0 0 12px'><button class='btn ghost' style='flex:1;padding:8px' data-add='100'>+100</button><button class='btn ghost' style='flex:1;padding:8px' data-add='500'>+500</button><button class='btn ghost' style='flex:1;padding:8px' data-add='1000'>+1000</button></div><label>Category<select id="ct"></select></label><div id='cq' hidden><label>Cheque number<input id='cn' maxlength='12' inputmode='numeric' placeholder='Optional' value='${esc(t.chq||'')}'></label><label>Status<select id='cs'><option value='pending'>Pending (not counted until cleared)</option><option value='cleared'>Cleared</option></select></label></div><label>Date<input id="dt" type="date" value="${t.date}"></label><label>Note<input id="nt" maxlength="60" placeholder="Optional" value="${esc(t.note)}"></label><p class="err" id="er"></p><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button></div>`);
const fill=()=>{$('#ct',m).innerHTML=Object.keys(CAT[ty]).map(c=>`<option ${c==t.cat?'selected':''}>${c}</option>`).join('');$$('#ty button',m).forEach(b=>b.classList.toggle('on',b.dataset.t==ty));if(ty=='trf'&&ac=='cheque')ac='online';const L=ty=='trf'?{cash:'Cash → Online',online:'Online → Cash'}:AL;$$('#ac button',m).forEach(b=>{b.textContent=L[b.dataset.c]||'';b.hidden=!L[b.dataset.c];b.classList.toggle('on',b.dataset.c==ac)});$('#cq',m).hidden=!(ac=='cheque'&&ty!='trf')};fill();$('#cs',m).value=t.cs||'pending';
$$('#ty button',m).forEach(b=>b.onclick=()=>{ty=b.dataset.t;fill()});
$$('#ac button',m).forEach(b=>b.onclick=()=>{ac=b.dataset.c;fill()});
$('#sv',m).onclick=()=>{const amt=parseFloat($('#am',m).value),date=$('#dt',m).value;
if(!(amt>0)||amt>1e9)return $('#er',m).textContent='Enter an amount between 0.01 and 1,000,000,000.';
if(!date)return $('#er',m).textContent='Pick a date.';
const r={...(ac=='cheque'&&ty!='trf'?{chq:$('#cn',m).value.trim(),cs:$('#cs',m).value}:{chq:'',cs:''}),type:ty,acc:ac,amt:Math.round(amt*100)/100,cat:$('#ct',m).value,date,note:$('#nt',m).value.trim()};
id?Object.assign(t,r):S.d.tx.push({id:Date.now().toString(36),...r});toast(id?'Record updated ✓':'Record added ✓');
save();m.remove();show()};
const am=$('#am',m),sl=$('#sl',m),syn=()=>{const v=parseFloat(am.value)||0;if(v>sl.max)sl.max=Math.ceil(v/1000)*2000;sl.value=v};
am.oninput=syn;sl.oninput=()=>{am.value=sl.value};
$$('[data-add]',m).forEach(b=>b.onclick=()=>{am.value=Math.round(((parseFloat(am.value)||0)+ +b.dataset.add)*100)/100;syn()});
am.focus()}
function look(){
const m=modal(`<h2>Theme &amp; colour</h2><div class="seg" id="th">${['auto','light','dark'].map(x=>`<button data-t="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><label>Accent shade</label><div class="sw" id="sw">${HUES.map(h=>`<button style="--c:${h}" data-h="${h}" aria-label="Shade ${h}"></button>`).join('')}</div><label>Fine-tune colour<input id="hr" type="range" min="0" max="360" value="${ui.hue}"></label><div class="row"><button class="btn" data-x>Done</button></div>`);
const mark=()=>{$$('#th button',m).forEach(b=>b.classList.toggle('on',b.dataset.t==ui.theme));$$('#sw button',m).forEach(b=>b.classList.toggle('on',b.dataset.h==ui.hue))};mark();
$$('#th button',m).forEach(b=>b.onclick=()=>{ui.theme=b.dataset.t;applyUI();mark()});
$$('#sw button',m).forEach(b=>b.onclick=()=>{ui.hue=+b.dataset.h;$('#hr',m).value=ui.hue;applyUI();mark();show()});
$('#hr',m).oninput=e=>{ui.hue=+e.target.value;applyUI();mark()};
$('#hr',m).onchange=show}
function ask(msg,yes,fn){const m=modal(`<h2>${msg}</h2><p class="mut">This can’t be undone.</p><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn red" id="y">${yes}</button></div>`);$('#y',m).onclick=()=>{fn();m.remove()}}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b||!S&&b.dataset.a!='rs')return;const a=b.dataset.a,id=b.dataset.id;
if(a=='nav'){S.view=b.dataset.v;show()}
else if(a=='more'){S.lim=(S.lim||60)+60;$('#lst').innerHTML=list()}
else if(a=='clr'){const t=S.d.tx.find(x=>x.id==id);t.cs='cleared';save();show();toast('Cheque marked as cleared ✓')}
else if(a=='scope'){S.acc=b.dataset.v;show()}
else if(a=='eye'){ui.hide=!ui.hide;applyUI();show()}
else if(a=='loan')loanModal();
else if(a=='repay')repayModal(id);
else if(a=='ldel')ask('Delete this record?','Delete',()=>{S.d.loans=S.d.loans.filter(l=>l.id!=id);save();show()});
else if(a=='goal')goalModal();
else if(a=='fund')fundModal(id);
else if(a=='rec')recModal();
else if(a=='gdel')ask('Delete this goal?','Delete',()=>{S.d.goals=S.d.goals.filter(g=>g.id!=id);save();show()});
else if(a=='rdel')ask('Delete this recurring entry?','Delete',()=>{S.d.rec=S.d.rec.filter(r=>r.id!=id);save();show()});
else if(a=='bk'){const m=modal(`<h2>Backup</h2><p class='mut'>Copy this text and keep it safe. Your records inside are encrypted.</p><textarea readonly></textarea><div class='row'><button class='btn' data-x>Close</button></div>`);const ta=$('textarea',m);ta.value=JSON.stringify({uid:S.uid,u:users()[S.uid],d:ls.get('mm:d:'+S.uid)});ta.select()}
else if(a=='rs'){const m=modal(`<h2>Restore backup</h2><p class='mut'>Paste your backup text, then log in with the same ID and password.</p><textarea id='rt'></textarea><p class='err' id='er'></p><div class='row'><button class='btn ghost' data-x>Cancel</button><button class='btn' id='sv'>Restore</button></div>`);$('#sv',m).onclick=()=>{try{const o=JSON.parse($('#rt',m).value);if(!o.uid||!o.u||!o.d)throw 0;const U=users();U[o.uid]=o.u;ls.set('mm:u',JSON.stringify(U));ls.set('mm:d:'+o.uid,o.d);m.remove();S=null;authView()}catch(x){$('#er',m).textContent='That backup text isn’t valid.'}}}
else if(a=='add')txModal();
else if(a=='addi')txModal(null,'inc');
else if(a=='adde')txModal(null,'exp');
else if(a=='edit')txModal(id);
else if(a=='del')ask('Delete this record?','Delete',()=>{const i=S.d.tx.findIndex(t=>t.id==id),rm=S.d.tx[i];S.d.tx.splice(i,1);save();show();toast('Record deleted',()=>{S.d.tx.splice(i,0,rm);save();show()})});
else if(a=='look')look();
else if(a=='out'){try{sessionStorage.removeItem('mm:s')}catch(x){}S=null;authView()}
else if(a=='wipe')ask('Delete all records?','Delete all',()=>{S.d.tx=[];save();show()});
else if(a=='csv'){const c=['Date,Type,Account,Category,Amount,Cheque No,Status,Note',...S.d.tx.map(t=>[t.date,t.type,t.acc||'online',t.cat,t.amt,t.chq||'',t.cs||'','"'+t.note.replace(/"/g,'""')+'"'].join(','))].join('\n');const m=modal(`<h2>CSV export</h2><textarea readonly></textarea><div class="row"><button class="btn" data-x>Close</button></div>`);const ta=$('textarea',m);ta.value=c;ta.select()}
});
document.addEventListener('input',e=>{if(!S)return;const i=e.target.id;
if(i=='q'){S.lim=0;S.q=e.target.value;$('#lst').innerHTML=list()}
else if(i=='f'||i=='m'||i=='af'){S.lim=0;S[i]=e.target.value;$('#lst').innerHTML=list()}
else if(i=='bg'){S.d.budget=Math.max(0,parseFloat(e.target.value)||0);save()}
else if(e.target.dataset.cb){(S.d.cb=S.d.cb||{})[e.target.dataset.cb]=Math.max(0,parseFloat(e.target.value)||0);save()}
else if(i=='oc'||i=='oo'){S.d.open=S.d.open||{};S.d.open[i=='oc'?'cash':'online']=parseFloat(e.target.value)||0;save()}
else if(i=='dlim'){S.d.dlim=Math.max(0,parseFloat(e.target.value)||0);save()}
else if(i=='cur'){S.d.cur=e.target.value;save()}});
function toast(msg,undo){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.append(t)}t.innerHTML=esc(msg)+(undo?` <button id='un'>Undo</button>`:'');t.className='show';if(undo)$('#un',t).onclick=()=>{undo();t.className=''};clearTimeout(t._h);t._h=setTimeout(()=>t.className='',undo?6000:2200)}
async function resume(){try{const o=JSON.parse(sessionStorage.getItem('mm:s')||'null');if(!o)return authView();const k=await crypto.subtle.importKey('raw',ub(o.r),'AES-GCM',false,['encrypt','decrypt']);S={uid:o.uid,k,r:o.r,d:await unseal(o.uid,k)};Object.assign(S,{view:'dash',q:'',f:'all',m:td().slice(0,7)});applyRec();shell();show()}catch(e){authView()}}
function net(){const n=$('#net');if(n)n.hidden=navigator.onLine}
addEventListener('online',()=>{net();toast('Back online')});addEventListener('offline',()=>{net();toast('You’re offline. Changes are still saved on this device.')});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const o=$$('.ov');o.length&&o[o.length-1].remove()}});
document.addEventListener('wheel',e=>{if(e.target.type=='number')e.target.blur()},{passive:true});
resume();
</script></body></html>
